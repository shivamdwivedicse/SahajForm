<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="340" viewBox="-30 0 1260 340" role="img" aria-label="SahajForm user journey">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121826"/></linearGradient>
  <style>
    text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .flow{stroke-dasharray:8 8;animation:d 1s linear infinite} @keyframes d{to{stroke-dashoffset:-16}}
    .s0{animation:g 7.5s ease-in-out 0.0s infinite}
    .s1{animation:g 7.5s ease-in-out 1.2s infinite}
    .s2{animation:g 7.5s ease-in-out 2.4s infinite}
    .s3{animation:g 7.5s ease-in-out 3.5999999999999996s infinite}
    .s4{animation:g 7.5s ease-in-out 4.8s infinite}
    @keyframes g{0%,100%{transform:translateY(0);filter:none}8%,16%{transform:translateY(-8px)}}
  </style>
</defs>
<rect x="-30" width="1260" height="340" rx="24" fill="url(#bg)"/>
<g class="s0"><rect x="40" y="110" width="200" height="170" rx="18" fill="#171e2d" stroke="#f5a623" stroke-width="2"/><circle cx="140.0" cy="110" r="26" fill="#f5a623"/><text x="140.0" y="119" text-anchor="middle" font-size="22" font-weight="800" fill="#0b0f17">1</text><text x="140.0" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Select</text><text x="140.0" y="200" text-anchor="middle" font-size="14.5" fill="#cbd2de">Grievance category</text><text x="140.0" y="246" text-anchor="middle" font-size="13" fill="#f5a623">7 departments</text></g>
