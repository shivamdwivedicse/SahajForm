<path class="flow" d="M724 195H756" stroke="#f5a623" stroke-width="3" fill="none"/><g class="s3"><rect x="760" y="110" width="200" height="170" rx="18" fill="#171e2d" stroke="#f5a623" stroke-width="2"/><circle cx="860.0" cy="110" r="26" fill="#f5a623"/><text x="860.0" y="119" text-anchor="middle" font-size="22" font-weight="800" fill="#0b0f17">3</text><text x="860.0" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Review</text><text x="860.0" y="200" text-anchor="middle" font-size="14.5" fill="#cbd2de">Fill missing details</text><text x="860.0" y="246" text-anchor="middle" font-size="13" fill="#f5a623">Both letters update live</text></g>
